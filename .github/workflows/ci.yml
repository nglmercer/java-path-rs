name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Live Adoptium tests weekly: they have caught two real defects, but the
    # API is a third party and should not be able to fail an unrelated PR.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Networking must stay optional: each feature has to build on its own.
      # --no-default-features is what makes these isolation checks: without it
      # the default features stay enabled and nothing is actually isolated.
      - run: cargo check --no-default-features
      - run: cargo check --no-default-features --features serde
      - run: cargo check --no-default-features --features network
      - run: cargo check --no-default-features --features install
      - run: cargo check --all-features

  test:
    # Every Java version on Linux, plus one version on each other target.
    # A bare `include:` of OSes does NOT cross-product with `java:` -- it
    # collapses to a single OS, which silently skipped Windows and macOS.
    name: test ${{ matrix.os }} / java ${{ matrix.java }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        java: ["8", "11", "17", "21", "25"]
        include:
          - { os: ubuntu-24.04-arm, java: "21" }
          - { os: windows-latest, java: "21" }   # exercises the .zip path
          - { os: macos-13, java: "21" }         # x86_64
          - { os: macos-14, java: "21" }         # arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # EXPECTED_JAVA_MAJOR turns the real-JDK legs into a real assertion:
      # discovery must find the JDK setup-java installed, at the right version.
      - run: cargo test --all-features
        env:
          EXPECTED_JAVA_MAJOR: ${{ matrix.java }}
      - run: cargo run --example discover

  # Two floors, because they genuinely differ: the dependency-free build works
  # on 1.75, while reqwest's ICU chain drags the networking features to 1.88.
  msrv-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo check --no-default-features --locked

  msrv-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      # --locked uses the committed lockfile, so the result reflects the
      # dependency versions we tested rather than whatever resolved today.
      - run: cargo check --all-features --locked

  # Deliberately separate from msrv: this job is *meant* to break when the
  # ecosystem moves, so breakage is a signal rather than random CI noise.
  latest-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update
      - run: cargo test --all-features

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  live:
    # Hits api.adoptium.net, so only on the weekly schedule or by hand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-features -- --ignored
